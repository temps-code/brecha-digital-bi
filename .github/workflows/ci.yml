name: CI y producción Streamlit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streamlit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pruebas Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar runtime ODBC
        run: sudo apt-get update && sudo apt-get install -y unixodbc
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Ejecutar pruebas sin credenciales ni SQL Server
        run: python -m pytest tests -q --ignore=tests/test_connection.py

  verify-production:
    name: Verificar versión publicada
    needs: tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
      url: https://brecha-digital-bolivia-bi.streamlit.app/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Instalar navegador de verificación
        run: |
          python -m pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium
      - name: Esperar el commit exacto en Streamlit Cloud
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: python scripts/verify_deployment.py
      - name: Resumen del despliegue verificado
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          echo "### Producción verificada" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "https://brecha-digital-bolivia-bi.streamlit.app/" \
            >> "$GITHUB_STEP_SUMMARY"
